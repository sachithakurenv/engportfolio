<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project | Sachi's Portfolio</title>
  <meta name="description" content="Environmental engineering project portfolio.">
  <link rel="canonical" href="https://infoshubhjain.github.io/stwebsite/project.html">
  <style>
    :root { --ink:#13294b; --paper:#f6faf7; --muted:#60717b; --line:#d7e5e1; --water:#00a3ad; --leaf:#4c956c; --gold:#ff5f05; --card:#fff; --header:rgba(19,41,75,.95); color-scheme:light; }
    [data-theme="dark"] { --ink:#e9f3f2; --paper:#07111d; --muted:#aab9bd; --line:rgba(185,218,210,.18); --water:#38d5df; --leaf:#7bd694; --gold:#ff7a2b; --card:#0b1c2b; --header:rgba(7,17,29,.95); color-scheme:dark; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:inherit; } img { display:block; max-width:100%; }
    header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem clamp(1rem,3vw,3rem); color:#fff; background:var(--header); }
    .brand { font-weight:800; text-decoration:none; } .back { color:#fff; font-weight:800; text-decoration:none; }
    .theme-toggle { min-height:2.35rem; padding:.45rem .7rem; color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:.5rem; cursor:pointer; font:inherit; font-weight:800; }
    main { max-width:72rem; margin:0 auto; padding:clamp(2rem,6vw,5rem) clamp(1rem,5vw,3rem) 5rem; }
    .eyebrow { margin:0 0:.7rem; color:var(--leaf); font-size:.8rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    h1 { max-width:16ch; margin:0; font-size:clamp(2.5rem,6vw,5.5rem); line-height:.96; } .summary { max-width:47rem; color:var(--muted); font-size:1.12rem; line-height:1.75; }
    .hero-image { width:100%; max-height:34rem; margin:2rem 0; object-fit:cover; border-radius:.5rem; }
    #project-detail { max-width:62rem; } #project-detail h3 { margin:2.1rem 0 .45rem; font-size:1.25rem; } #project-detail p { margin:0; color:var(--muted); line-height:1.75; }
    .project-gallery { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.7rem; margin-top:2rem; } .project-gallery figure { margin:0; } .project-gallery a { display:block; border:1px solid var(--line); border-radius:.45rem; overflow:hidden; } .project-gallery img { width:100%; height:12rem; object-fit:cover; } .project-gallery figcaption { margin-top:.35rem; color:var(--muted); font-size:.78rem; line-height:1.3; } .project-gallery a:hover { outline:2px solid var(--water); }
    .project-links { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:2rem; } .project-links a { padding:.65rem .8rem; color:var(--ink); background:rgba(255,95,5,.12); border:1px solid rgba(255,95,5,.28); border-radius:.45rem; font-weight:800; text-decoration:none; }
    @media (max-width:700px) { header { align-items:flex-start; flex-wrap:wrap; } .project-gallery { grid-template-columns:1fr; } .project-gallery img { height:auto; } }
  </style>
</head>
<body id="project-page">
  <header>
    <a class="brand" href="index.html">Sachi's Portfolio</a>
    <a class="back" href="index.html#projects">Back to projects</a>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">◐</span> <span class="theme-label">Theme</span></button>
  </header>
  <main>
    <p class="eyebrow" data-project-category>Environmental engineering</p>
    <h1 data-project-title>Project</h1>
    <p class="summary" data-project-summary></p>
    <img class="hero-image" data-project-image src="" alt="">
    <section id="project-detail" aria-label="Project details"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
