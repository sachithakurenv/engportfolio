<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Sachi's Portfolio</title>
  <style>
    :root { --ink:#13294b; --paper:#f6faf7; --line:#d7e5e1; --accent:#ff5f05; } * { box-sizing:border-box; }
    body { max-width:900px; margin:0 auto; padding:2rem 1rem 4rem; color:var(--ink); background:var(--paper); font-family:Inter,system-ui,sans-serif; } h1 { margin:0; } h2 { margin-top:2rem; } .intro { color:#526168; line-height:1.6; }
    form { display:grid; gap:1rem; } label { display:grid; gap:.4rem; font-weight:800; } input, textarea { width:100%; padding:.75rem; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:.35rem; font:inherit; } textarea { min-height:6rem; resize:vertical; }
    .project { padding:1rem; background:#fff; border:1px solid var(--line); border-radius:.5rem; } .actions { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1rem; } button, .button { padding:.75rem 1rem; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:.35rem; font:inherit; font-weight:800; text-decoration:none; cursor:pointer; } .primary { background:var(--accent); border-color:var(--accent); }
  </style>
</head>
<body>
  <h1>Edit portfolio content</h1>
  <p class="intro">Change the text below, preview it, then download the updated content file for GitHub.</p>
  <form id="editor"></form>
  <div class="actions"><button class="primary" id="preview" type="button">Preview changes</button><button id="download" type="button">Download content.json</button><a class="button" href="https://github.com/sachithakurenv/engportfolio/upload/gh-pages" target="_blank" rel="noreferrer">Publish on GitHub</a><a class="button" href="index.html">Back to portfolio</a></div>
  <script>
    const form = document.querySelector("#editor");
    let content;
    const fields = ["siteTitle", "tagline", "intro", "profileTitle", "profileText", "email", "phone", "location"];
    const label = (name) => name.replace(/([A-Z])/g, " $1").replace(/^./, (letter) => letter.toUpperCase());
    const addField = (name, value, onChange, multiline = false) => {
      const field = document.createElement("label"); field.textContent = label(name);
      const input = document.createElement(multiline ? "textarea" : "input"); input.value = value || "";
      input.addEventListener("input", () => onChange(input.value)); field.append(input); form.append(field);
    };
    const render = () => {
      form.replaceChildren();
      fields.forEach((name) => addField(name, content[name], (value) => content[name] = value, ["tagline", "intro", "profileText"].includes(name)));
      const heading = document.createElement("h2"); heading.textContent = "Projects"; form.append(heading);
      content.projects.forEach((project) => {
        const group = document.createElement("section"); group.className = "project";
        const title = document.createElement("strong"); title.textContent = project.category; group.append(title);
        const titleLabel = document.createElement("label"); titleLabel.textContent = "Project title";
        const titleInput = document.createElement("input"); titleInput.value = project.title; titleInput.addEventListener("input", () => project.title = titleInput.value); titleLabel.append(titleInput);
        const summaryLabel = document.createElement("label"); summaryLabel.textContent = "Project summary";
        const summaryInput = document.createElement("textarea"); summaryInput.value = project.summary; summaryInput.addEventListener("input", () => project.summary = summaryInput.value); summaryLabel.append(summaryInput);
        group.append(titleLabel, summaryLabel); form.append(group);
      });
    };
    fetch("content.json", { cache: "no-store" }).then((response) => response.json()).then((data) => { content = data; render(); });
    document.querySelector("#preview").addEventListener("click", () => { localStorage.setItem("sachi-portfolio-draft", JSON.stringify(content)); open("index.html?preview", "_blank"); });
    document.querySelector("#download").addEventListener("click", () => { const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([JSON.stringify(content, null, 2)], { type:"application/json" })); link.download = "content.json"; link.click(); URL.revokeObjectURL(link.href); });
  </script>
</body>
</html>
